name: Release

# Builds the plugin jar for a tag and publishes it as a GitHub Release.
# - Pushing a tag v* releases that tag with the current JDK (25).
# - Run manually (Actions → Release → Run workflow) to release an older commit: the tag is
#   created at `target` if it doesn't exist yet. Release notes come from CHANGELOG.md on main.
#
# Actions are pinned to full commit SHAs (version in the trailing comment) because this
# workflow runs with contents: write. Update both the SHA and the comment together.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0'
        required: true
      target:
        description: 'Commit SHA to tag (only used when the tag does not exist yet)'
        required: false
      java-version:
        description: 'JDK used to build (1.x needs 21, 2.x needs 25)'
        required: false
        default: '25'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version || '25' }}
          cache: maven
      - name: Build and test
        run: |
          if [ -x ./mvnw ]; then ./mvnw -B verify; else mvn -B verify; fi
      - name: Release notes from CHANGELOG.md on main
        run: |
          version="${TAG#v}"
          git fetch --quiet origin main
          git show origin/main:CHANGELOG.md \
            | awk -v v="$version" '
                index($0, "## [" v "]") == 1 { found = 1; next }
                found && /^## \[/ { exit }
                found && !/^\[[^]]+\]: / { print }
              ' > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md entry for $version" > notes.md; fi
          cat notes.md
      - name: Publish release
        run: |
          args=(--title "AutoPickup ${TAG#v}" --notes-file notes.md)
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            args+=(--target "${TARGET:?target is required when the tag does not exist}")
          fi
          gh release create "$TAG" target/AutoPickup-*.jar "${args[@]}"
